openapi: 3.0.0
info:
  title: Flight Booking API
  version: 1.0.0
paths:
  /api/auth/register:
    post:
      summary: Register a user
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        "201":
          description: Created
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /api/flights:
    get:
      summary: List flights with filters
      parameters:
        - in: query
          name: departureCity
          schema: { type: string }
        - in: query
          name: arrivalCity
          schema: { type: string }
      responses:
        "200":
          description: OK
